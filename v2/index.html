<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Version Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="editor-container">
            <textarea id="editor" placeholder="Start typing here..."></textarea>
        </div>
        <div class="timeline-container">
            <div id="timeline-tree"></div>
        </div>
        <div class="raw-storage-container">
            <h3>Raw Storage Content:</h3>
            <pre id="raw-storage-display"></pre>
        </div>
    </div>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
    <footer style="text-align:center;padding:12px;font-size:0.75rem;color:#999;">
      <a href="https://dannyhope.co.uk" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;" onmouseover="this.style.color='#1A272C'" onmouseout="this.style.color='#999'">A Danny Hope product</a>
    </footer>
</body>
</html>
