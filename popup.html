<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapling</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="title">Sapling</div>
        <div class="subtitle">Text version control for your writing.</div>

      <section class="actions">
        <button type="button" class="primary" id="open-sapling">Open Sapling</button>
        <p class="hint">Opens the full editor + timeline in a new tab.</p>
      </section>

      <footer class="footer">
        <a
          href="https://dannyhope.co.uk"
          target="_blank"
          rel="noopener noreferrer"
          class="attribution"
          >A Danny Hope product</a
        >
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
