<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sapling – Usability Test Runner</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; }
		h1 { font-size: 1.25rem; margin-bottom: 4px; }
		.subtitle { color: #666; font-size: 0.875rem; margin-bottom: 24px; }
		.task-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; border: 2px solid transparent; }
		.task-card.active { border-color: #0C679C; }
		.task-card.complete { opacity: 0.5; }
		.task-number { font-size: 0.75rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
		.task-title { font-size: 1.1rem; font-weight: 600; margin: 4px 0 8px; }
		.task-desc { color: #444; font-size: 0.9rem; line-height: 1.5; margin-bottom: 12px; }
		.task-criteria { font-size: 0.8rem; color: #666; font-style: italic; margin-bottom: 12px; }
		.btn { display: inline-block; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
		.btn-primary { background: #0C679C; color: white; }
		.btn-success { background: #00B400; color: white; }
		.btn-secondary { background: #eee; color: #333; }
		.btn + .btn { margin-left: 8px; }
		.notes-area { width: 100%; margin-top: 12px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 0.875rem; resize: vertical; min-height: 80px; }
		.session-controls { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
		.session-controls input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.875rem; flex: 1; }
		.export-section { margin-top: 24px; padding: 16px; background: white; border-radius: 8px; }
		footer { margin-top: 32px; text-align: center; font-size: 0.75rem; color: #bbb; }
		footer a { color: inherit; text-decoration: none; }
		footer a:hover { color: #444; }
	</style>
</head>
<body>
	<h1>Sapling – Usability Test Runner</h1>
	<p class="subtitle">Facilitator view. Replace placeholder tasks with project-specific ones via <code>/usability-test generate</code>.</p>

	<div class="session-controls">
		<input type="text" id="participant-name" placeholder="Participant name or ID" />
		<button class="btn btn-primary" onclick="startSession()">Start session</button>
		<button class="btn btn-secondary" onclick="exportResults()">Export JSON</button>
	</div>

	<div id="tasks-container"></div>

	<footer><a href="https://dannyhope.co.uk" target="_blank" rel="noopener noreferrer">A Danny Hope product</a></footer>

	<script>
		let tasks = [];
		let sessionData = { participant: '', startTime: null, results: [] };

		async function loadTasks() {
			try {
				const res = await fetch('_docs/usability-tasks.json');
				const data = await res.json();
				tasks = data.tasks;
				renderTasks();
			} catch (e) {
				document.getElementById('tasks-container').innerHTML = '<p style="color:red">Could not load _docs/usability-tasks.json</p>';
			}
		}

		function renderTasks() {
			const container = document.getElementById('tasks-container');
			container.innerHTML = tasks.map((task, i) => `
				<div class="task-card" id="card-${task.id}" data-id="${task.id}">
					<div class="task-number">Task ${i + 1}</div>
					<div class="task-title">${task.title}</div>
					<div class="task-desc">${task.description}</div>
					<div class="task-criteria">Success: ${task.successCriteria}</div>
					<button class="btn btn-primary" onclick="markResult('${task.id}', 'success')">✓ Success</button>
					<button class="btn btn-secondary" onclick="markResult('${task.id}', 'partial')">~ Partial</button>
					<button class="btn btn-secondary" onclick="markResult('${task.id}', 'fail')">✗ Fail</button>
					<br>
					<textarea class="notes-area" id="notes-${task.id}" placeholder="Observations…"></textarea>
				</div>
			`).join('');
		}

		function startSession() {
			const name = document.getElementById('participant-name').value.trim();
			if (!name) { alert('Enter a participant name first.'); return; }
			sessionData.participant = name;
			sessionData.startTime = new Date().toISOString();
			sessionData.results = [];
		}

		function markResult(taskId, outcome) {
			const card = document.getElementById(`card-${taskId}`);
			card.classList.add('complete');
			const notes = document.getElementById(`notes-${taskId}`).value;
			const existing = sessionData.results.findIndex(r => r.taskId === taskId);
			const result = { taskId, outcome, notes, timestamp: new Date().toISOString() };
			if (existing >= 0) sessionData.results[existing] = result;
			else sessionData.results.push(result);
		}

		function exportResults() {
			const blob = new Blob([JSON.stringify(sessionData, null, 2)], { type: 'application/json' });
			const a = document.createElement('a');
			a.href = URL.createObjectURL(blob);
			a.download = `usability-${sessionData.participant || 'session'}-${Date.now()}.json`;
			a.click();
		}

		loadTasks();
	</script>
</body>
</html>
